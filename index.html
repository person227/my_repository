<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8efe0">
  <title>Spider Rescue | My Arcade</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18233c;
      --muted: #66718d;
      --paper: #fffaf0;
      --coral: #ef6f61;
      --gold: #f5b83d;
      --teal: #42b7a5;
      --navy: #29345f;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      margin: 0;
      padding: 24px;
      overflow-x: hidden;
      overflow-y: auto;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(245, 184, 61, .24) 0 3px, transparent 4px),
        radial-gradient(circle at 82% 12%, rgba(66, 183, 165, .2) 0 4px, transparent 5px),
        linear-gradient(135deg, #f8efe0 0%, #dcefe7 100%);
      font-family: Georgia, 'Times New Roman', serif;
    }

    .arcade-card {
      position: relative;
      isolation: isolate;
      display: grid;
      justify-items: center;
      width: min(100%, 760px);
      min-height: min(600px, calc(100svh - 48px));
      align-content: center;
      padding: clamp(34px, 8vw, 80px) 24px;
      overflow: hidden;
      border: 2px solid rgba(41, 52, 95, .16);
      border-radius: 28px;
      background: rgba(255, 250, 240, .88);
      box-shadow: 0 24px 70px rgba(41, 52, 95, .16);
      text-align: center;
    }

    .arcade-card::before,
    .arcade-card::after {
      position: absolute;
      z-index: -1;
      content: "";
      border-radius: 50%;
      pointer-events: none;
    }

    .arcade-card::before {
      top: -125px;
      right: -85px;
      width: 290px;
      height: 290px;
      background: radial-gradient(circle, rgba(245, 184, 61, .25), rgba(245, 184, 61, 0) 70%);
    }

    .arcade-card::after {
      bottom: -150px;
      left: -110px;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(66, 183, 165, .22), rgba(66, 183, 165, 0) 70%);
    }

    .sparkle {
      position: absolute;
      color: var(--gold);
      font: 28px/1 Georgia, serif;
      user-select: none;
    }

    .sparkle-one { top: 19%; left: 15%; }
    .sparkle-two { top: 27%; right: 16%; color: var(--teal); font-size: 20px; }
    .sparkle-three { bottom: 20%; right: 22%; color: var(--coral); font-size: 17px; }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--coral);
      font: 700 12px/1.2 'Trebuchet MS', sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(52px, 10vw, 100px);
      line-height: .95;
      letter-spacing: -.065em;
    }

    h1 span {
      display: block;
      color: var(--coral);
    }

    .description {
      max-width: 390px;
      margin: 24px 0 34px;
      color: var(--muted);
      font: 17px/1.6 'Trebuchet MS', sans-serif;
    }

    .play-button {
      display: inline-flex;
      min-width: 220px;
      min-height: 68px;
      align-items: center;
      justify-content: center;
      gap: 13px;
      padding: 16px 30px;
      border: 0;
      border-radius: 999px;
      color: var(--paper);
      background: var(--navy);
      box-shadow: 0 9px 0 #1b2446, 0 15px 28px rgba(41, 52, 95, .2);
      font: 700 20px/1 'Trebuchet MS', sans-serif;
      text-decoration: none;
      transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease;
    }

    .play-button:hover {
      transform: translateY(-3px);
      background: #39477b;
      box-shadow: 0 12px 0 #1b2446, 0 19px 30px rgba(41, 52, 95, .22);
    }

    .play-button:active {
      transform: translateY(5px);
      box-shadow: 0 4px 0 #1b2446, 0 9px 20px rgba(41, 52, 95, .18);
    }

    .play-button:focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 7px;
    }

    .play-icon { color: var(--gold); font-size: 22px; }

    @media (max-width: 480px) {
      .arcade-card { min-height: min(540px, calc(100svh - 32px)); padding-inline: 20px; }
      .description { font-size: 15px; }
      .play-button { min-width: 200px; min-height: 62px; font-size: 18px; }
      .sparkle-one { left: 8%; }
      .sparkle-two { right: 9%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="arcade-card">
    <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
    <span class="sparkle sparkle-two" aria-hidden="true">✦</span>
    <span class="sparkle sparkle-three" aria-hidden="true">✦</span>
    <p class="eyebrow">Welcome to my arcade</p>
    <h1>Spider <span>Rescue</span></h1>
    <p class="description">Catch sneaky spiders, clear their webs, and keep the blue morphos safe.</p>
    <a class="play-button" href="gametwo.html">Play <span class="play-icon" aria-hidden="true">▶</span></a>
  </main>
</body>
</html>
