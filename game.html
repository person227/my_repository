<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Catcher | My Arcade</title>
  <style>
    :root {
      --ink: #18233c;
      --muted: #66718d;
      --paper: #fffaf0;
      --cream: #f6ead2;
      --coral: #ef6f61;
      --gold: #f5b83d;
      --teal: #42b7a5;
      --navy: #29345f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(245, 184, 61, .24) 0 3px, transparent 4px),
        radial-gradient(circle at 82% 12%, rgba(66, 183, 165, .2) 0 4px, transparent 5px),
        linear-gradient(135deg, #f8efe0 0%, #dcefe7 100%);
      font-family: Georgia, 'Times New Roman', serif;
    }

    .game-shell {
      width: min(100%, 980px);
      padding: clamp(18px, 3vw, 34px);
      border: 2px solid rgba(41, 52, 95, .16);
      border-radius: 22px;
      background: rgba(255, 250, 240, .86);
      box-shadow: 0 22px 60px rgba(41, 52, 95, .16);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--coral);
      font: 700 12px/1.2 'Trebuchet MS', sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: .95;
      letter-spacing: -.04em;
    }

    .subtitle {
      max-width: 270px;
      margin: 0;
      color: var(--muted);
      font: 15px/1.45 'Trebuchet MS', sans-serif;
      text-align: right;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      padding: 12px 15px;
      border: 1px solid rgba(41, 52, 95, .13);
      border-radius: 12px;
      background: rgba(255, 255, 255, .57);
      font-family: 'Trebuchet MS', sans-serif;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      margin-top: 3px;
      color: var(--navy);
      font-size: clamp(20px, 3vw, 27px);
      font-weight: 700;
    }

    .stage-wrap {
      position: relative;
      overflow: hidden;
      border: 3px solid var(--navy);
      border-radius: 16px;
      background: #172447;
      box-shadow: inset 0 0 0 4px rgba(255, 250, 240, .2);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      cursor: none;
    }

    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(23, 36, 71, .78);
      text-align: center;
    }

    .message[hidden] { display: none; }

    .message-card {
      max-width: 380px;
      padding: 28px 28px 24px;
      border: 2px solid rgba(255, 250, 240, .8);
      border-radius: 16px;
      color: var(--paper);
      background: rgba(41, 52, 95, .95);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .2);
    }

    .message-card h2 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
    }

    .message-card p {
      margin: 0 0 18px;
      color: #d7e4e3;
      font: 15px/1.5 'Trebuchet MS', sans-serif;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      color: #fffaf0;
      background: var(--coral);
      font: 700 14px 'Trebuchet MS', sans-serif;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    button:hover, button:focus-visible {
      background: #dc5c50;
      outline: 3px solid rgba(245, 184, 61, .55);
      outline-offset: 3px;
      transform: translateY(-2px);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 15px;
      color: var(--muted);
      font: 13px/1.45 'Trebuchet MS', sans-serif;
    }

    .keys {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      color: var(--navy);
      font-weight: 700;
    }

    kbd {
      min-width: 28px;
      padding: 5px 8px;
      border: 1px solid rgba(41, 52, 95, .24);
      border-bottom-width: 3px;
      border-radius: 6px;
      background: #fff;
      text-align: center;
    }

    @media (max-width: 620px) {
      body { padding: 10px; }
      header { display: block; }
      .subtitle { max-width: none; margin-top: 12px; text-align: left; }
      .controls { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">My Arcade / Skill Game</p>
        <h1>Star Catcher</h1>
      </div>
      <p class="subtitle">Guide your basket through the night and bring ten stars home.</p>
    </header>

    <section class="hud" aria-label="Game status">
      <div class="stat"><span class="stat-label">Caught</span><span class="stat-value" id="caught">0 / 10</span></div>
      <div class="stat"><span class="stat-label">Missed</span><span class="stat-value" id="missed">0 / 3</span></div>
      <div class="stat"><span class="stat-label">Best score</span><span class="stat-value" id="best">0</span></div>
    </section>

    <div class="stage-wrap">
      <canvas id="game" width="960" height="540" aria-label="Star catching game. Use the left and right arrow keys to move the basket."></canvas>
      <div class="message" id="message">
        <div class="message-card">
          <h2 id="message-title">Ready?</h2>
          <p id="message-copy">Catch 10 falling stars before 3 slip past you.</p>
          <button id="start-button" type="button">Start game</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <span>Move the basket with <span class="keys"><kbd>←</kbd><kbd>→</kbd></span></span>
      <span>Stars caught: <strong>10</strong> &middot; Misses allowed: <strong>3</strong></span>
    </div>
  </main>

  <script>
    'use strict';

    const canvas = document.getElementById('game');
    const context = canvas.getContext('2d');
    const caughtElement = document.getElementById('caught');
    const missedElement = document.getElementById('missed');
    const bestElement = document.getElementById('best');
    const message = document.getElementById('message');
    const messageTitle = document.getElementById('message-title');
    const messageCopy = document.getElementById('message-copy');
    const startButton = document.getElementById('start-button');

    const width = canvas.width;
    const height = canvas.height;
    const keys = { left: false, right: false };
    const state = {
      running: false,
      caught: 0,
      missed: 0,
      best: Number(localStorage.getItem('star-catcher-best') || 0),
      basket: { x: width / 2 - 62, y: height - 58, width: 124, height: 28, speed: 9 },
      stars: [],
      particles: [],
      spawnTimer: 0,
      lastTime: 0,
      animationFrame: 0
    };

    bestElement.textContent = state.best;

    function resetGame() {
      state.running = true;
      state.caught = 0;
      state.missed = 0;
      state.stars = [];
      state.particles = [];
      state.spawnTimer = 0;
      state.basket.x = width / 2 - state.basket.width / 2;
      state.lastTime = performance.now();
      message.hidden = true;
      updateHud();
      cancelAnimationFrame(state.animationFrame);
      state.animationFrame = requestAnimationFrame(gameLoop);
    }

    function updateHud() {
      caughtElement.textContent = state.caught + ' / 10';
      missedElement.textContent = state.missed + ' / 3';
      bestElement.textContent = state.best;
    }

    function finish(won) {
      state.running = false;
      const title = won ? 'You caught them all!' : 'The stars got away';
      const copy = won
        ? 'Ten bright stars are safely in your basket. Nice work.'
        : 'Three stars fell past the basket. Give it another try.';
      messageTitle.textContent = title;
      messageCopy.textContent = copy;
      startButton.textContent = 'Play again';
      message.hidden = false;
    }

    function spawnStar() {
      const radius = 13 + Math.random() * 6;
      state.stars.push({
        x: radius + Math.random() * (width - radius * 2),
        y: -radius,
        radius,
        speed: 175 + Math.random() * 85 + state.caught * 5,
        rotation: Math.random() * Math.PI,
        spin: (Math.random() - .5) * 2.5
      });
    }

    function createBurst(x, y, color) {
      for (let index = 0; index < 12; index += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 45 + Math.random() * 100;
        state.particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: .65,
          color
        });
      }
    }

    function update(delta) {
      if (keys.left) state.basket.x -= state.basket.speed * delta * 60;
      if (keys.right) state.basket.x += state.basket.speed * delta * 60;
      state.basket.x = Math.max(10, Math.min(width - state.basket.width - 10, state.basket.x));

      state.spawnTimer -= delta;
      if (state.spawnTimer <= 0) {
        spawnStar();
        state.spawnTimer = Math.max(.5, .86 - state.caught * .025);
      }

      for (let index = state.stars.length - 1; index >= 0; index -= 1) {
        const star = state.stars[index];
        star.y += star.speed * delta;
        star.rotation += star.spin * delta;
        const insideBasket = star.y + star.radius >= state.basket.y
          && star.y - star.radius <= state.basket.y + state.basket.height
          && star.x >= state.basket.x - star.radius
          && star.x <= state.basket.x + state.basket.width + star.radius;

        if (insideBasket) {
          state.stars.splice(index, 1);
          state.caught += 1;
          createBurst(star.x, star.y, '#f5b83d');
          updateHud();
          if (state.caught >= 10) finish(true);
        } else if (star.y - star.radius > height) {
          state.stars.splice(index, 1);
          state.missed += 1;
          createBurst(star.x, height - 18, '#ef6f61');
          updateHud();
          if (state.missed >= 3) finish(false);
        }
      }

      for (let index = state.particles.length - 1; index >= 0; index -= 1) {
        const particle = state.particles[index];
        particle.x += particle.vx * delta;
        particle.y += particle.vy * delta;
        particle.vy += 90 * delta;
        particle.life -= delta;
        if (particle.life <= 0) state.particles.splice(index, 1);
      }
    }

    function drawBackground() {
      const gradient = context.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, '#1c2c5a');
      gradient.addColorStop(1, '#101b3b');
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);

      context.fillStyle = 'rgba(255, 250, 240, .55)';
      for (let index = 0; index < 44; index += 1) {
        const x = (index * 197) % width;
        const y = (index * 83) % (height - 90);
        const size = index % 4 === 0 ? 2.5 : 1.3;
        context.beginPath();
        context.arc(x, y, size, 0, Math.PI * 2);
        context.fill();
      }

      context.fillStyle = 'rgba(66, 183, 165, .13)';
      context.beginPath();
      context.arc(width * .78, height * .13, 90, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = 'rgba(245, 184, 61, .1)';
      context.beginPath();
      context.arc(width * .15, height * .55, 120, 0, Math.PI * 2);
      context.fill();
    }

    function drawStar(star) {
      context.save();
      context.translate(star.x, star.y);
      context.rotate(star.rotation);
      context.beginPath();
      for (let point = 0; point < 10; point += 1) {
        const angle = -Math.PI / 2 + point * Math.PI / 5;
        const radius = point % 2 === 0 ? star.radius : star.radius * .43;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (point === 0) context.moveTo(x, y); else context.lineTo(x, y);
      }
      context.closePath();
      context.shadowColor = '#f5b83d';
      context.shadowBlur = 16;
      context.fillStyle = '#f5b83d';
      context.fill();
      context.shadowBlur = 0;
      context.fillStyle = 'rgba(255, 250, 240, .7)';
      context.beginPath();
      context.arc(-star.radius * .22, -star.radius * .26, star.radius * .16, 0, Math.PI * 2);
      context.fill();
      context.restore();
    }

    function drawBasket() {
      const basket = state.basket;
      context.save();
      context.translate(basket.x, basket.y);

      const centerX = basket.width / 2;
      const torsoY = 18;
      const armY = 46;
      const legY = 92;

      context.strokeStyle = '#1f0d09';
      context.lineWidth = 5;
      context.lineCap = 'round';

      context.beginPath();
      context.moveTo(centerX, torsoY);
      context.lineTo(centerX, legY);
      context.stroke();

      context.beginPath();
      context.moveTo(centerX, 34);
      context.lineTo(centerX - 28, 56);
      context.stroke();

      context.beginPath();
      context.moveTo(centerX, 34);
      context.lineTo(centerX + 28, 56);
      context.stroke();

      context.beginPath();
      context.moveTo(centerX, legY);
      context.lineTo(centerX - 22, 122);
      context.stroke();

      context.beginPath();
      context.moveTo(centerX, legY);
      context.lineTo(centerX + 22, 122);
      context.stroke();

      context.beginPath();
      context.arc(centerX, 8, 12, 0, Math.PI * 2);
      context.stroke();

      context.restore();
    }

    function drawParticles() {
      state.particles.forEach((particle) => {
        context.globalAlpha = Math.max(0, particle.life);
        context.fillStyle = particle.color;
        context.beginPath();
        context.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
        context.fill();
      });
      context.globalAlpha = 1;
    }

    function draw() {
      drawBackground();
      state.stars.forEach(drawStar);
      drawParticles();
      drawBasket();
    }

    function gameLoop(timestamp) {
      const delta = Math.min((timestamp - state.lastTime) / 1000, .035);
      state.lastTime = timestamp;
      if (state.running) update(delta);
      draw();
      if (state.running) state.animationFrame = requestAnimationFrame(gameLoop);
    }

    function setKey(key, pressed) {
      if (key === 'ArrowLeft') keys.left = pressed;
      if (key === 'ArrowRight') keys.right = pressed;
    }

    window.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        setKey(event.key, true);
      }
    });

    window.addEventListener('keyup', (event) => setKey(event.key, false));
    startButton.addEventListener('click', resetGame);

    draw();
  </script>
</body>
</html>
